<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css"
          rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}"
          rel="stylesheet"
          type="text/css"/>
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
            crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/i18n/defaults-ru_RU.min.js"></script>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/logo.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Projects cloud{% endblock %}</title>
</head>
<body class="bg-dark text-white">
    <header>
        <nav class="navbar navbar-dark fixed-top my-dark">
            <div class="container">
                <a class="navbar-brand" href="/">
                    <img class="d-inline-block align-top" src="{{ url_for('static', filename='img/logo.png') }}"
                         alt="" width="40">
                    Projects cloud
                </a>
                {% if current_user.is_authenticated %}
                    <div class="dropdown">
                        <button type="button" class="btn btn-outline-light dropdown-toggle"
                                id="dropdownMenu" data-bs-toggle="dropdown">
                            <i class="bi bi-person-fill"></i>
                            {{ current_user.name }} {{ current_user.surname }}
                        </button>
                        <div class="dropdown-menu dropdown-menu-end dropdown-menu-dark" aria-labelledby="dropdownMenu">
                            <a class="dropdown-item" href="{{ url_for('main.profile') }}">Изменить профиль</a>
                            <form method="post" action="{{ url_for('main.logout') }}">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <button type="submit" class="dropdown-item">Выйти из аккаунта</button>
                            </form>
                        </div>
                    </div>
                {% else %}
                    <div>
                        <a class="btn btn-outline-light me-2" href="{{ url_for('main.login') }}">Войти</a>
                        <a class="btn btn-outline-warning" href="{{ url_for('main.register') }}">Зарегистрироваться</a>
                    </div>
                {% endif %}
            </div>
        </nav>
    </header>
    <main role="main" class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
                </div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
